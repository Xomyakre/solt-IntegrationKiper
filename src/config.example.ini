; Пример настроек. Скопируйте в config.ini (рядом с web_demo.py или SoltPagerService.exe)
; и заполните. config.ini в git не попадает.

[Web]
port = 8000
; Логин и пароль для веб-панели. Если admin_password пустой, панель открыта всем в сети.
; Вебхук /kds пароль не требует.
admin_user = admin
admin_password =

[RK]
; Кассовый сервер RK7: тот же пользователь HTTP-интерфейса, что и у модуля KDS
host = 127.0.0.1
port = 8088
user =
password =
; SeqNum - порядковый номер заказа (рекомендуется), OrderNum - номер заказа (тестовый режим)
orderidentifier = SeqNum

[ComPort]
port = COM1

[Solt]
; Сброс пейджера при статусе KDS «Выдан»:
; off - не сбрасывать (гость снимает вызов кнопкой или возвратом на станцию)
; SP / SG - отправить CANCEL с этой целью (сначала проверьте кнопками в панели)
cancel_target = off

[Log]
log_dir = log
log_count = 10
log_interval = 1
